<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>English Teaching Manager</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

      <header class="topbar">

        <nav>

          <a href="index.html">Home</a>

          <button id="lang-toggle">PT</button>

        </nav>

      </header>

      <main>

        <h1 id="page-title">English Teaching Manager</h1>
        
        <input type="search" id="search" placeholder="Search a topic">

        <div class="filters">

          <div class="filter-item">
            <label for="filter-age">Age group</label>
            <select id="filter-age"></select>
          </div>

          <div class="filter-item">
            <label for="filter-level">Level</label>
            <select id="filter-level"></select>
          </div>

          <div class="filter-item">
            <label for="filter-skill">Skill</label>
            <select id="filter-skill"></select>
          </div>
          
          <div class="filter-item">
            <label for="filter-resource">Resource</label>
            <select id="filter-resource"></select>
          </div>
          
          <div class="filter-item">
            <label for="filter-mode">Teaching mode</label>
            <select id="filter-mode"></select>
          </div> 

        </div>

        <div id="topic-grid" class="grid"></div>

      </main>

      <script src="js/data.js"></script>  
      <script src="js/app.js"></script>  
    </body>

</html>
